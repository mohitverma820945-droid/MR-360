    <script>
      // Permanent suppression & graceful no-op for Vite HMR WebSocket in iframe/proxy environments
      (function() {
        // 1. Filter all console methods from logging [vite] websocket connection messages
        ['error', 'warn', 'log', 'info', 'debug'].forEach(function(method) {
          var original = console[method];
          if (!original) return;
          console[method] = function() {
            var args = Array.prototype.slice.call(arguments);
            var text = args.map(function(a) { 
              try {
                return (typeof a === 'object' && a !== null) ? (a.message || a.stack || JSON.stringify(a)) : String(a);
              } catch (e) {
                return String(a);
              }
            }).join(' ');

            if (
              text.indexOf('WebSocket') !== -1 || 
              text.indexOf('websocket') !== -1 || 
              text.indexOf('[vite]') !== -1 ||
              text.indexOf('vite-hmr') !== -1
            ) {
              return;
            }
            original.apply(console, args);
          };
        });

        // 2. Safely stub WebSocket for vite-hmr requests so browser never attempts or fails connection
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          var PatchedWebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            var protoStr = String(protocols || '');
            if (
              urlStr.indexOf('vite') !== -1 || 
              protoStr.indexOf('vite') !== -1 || 
              urlStr.indexOf('ws://') !== -1 || 
              urlStr.indexOf('wss://') !== -1
            ) {
              var listeners = {};
              var dummy = {
                url: urlStr,
                readyState: 1, // OPEN (satisfies Vite client check)
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                binaryType: 'blob',
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                send: function() {},
                close: function() {},
                addEventListener: function(type, fn) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(function() { 
                      try { fn({ type: 'open', target: dummy }); } catch(e){} 
                    }, 0);
                  }
                },
                removeEventListener: function(type, fn) {
                  if (!listeners[type]) return;
                  listeners[type] = listeners[type].filter(function(f) { return f !== fn; });
                },
                dispatchEvent: function() { return true; },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null
              };
              setTimeout(function() {
                if (typeof dummy.onopen === 'function') {
                  try { dummy.onopen({ type: 'open', target: dummy }); } catch(e){}
                }
              }, 0);
              return dummy;
            }
            return new NativeWebSocket(url, protocols);
          };
          PatchedWebSocket.prototype = NativeWebSocket.prototype;
          PatchedWebSocket.CONNECTING = 0;
          PatchedWebSocket.OPEN = 1;
          PatchedWebSocket.CLOSING = 2;
          PatchedWebSocket.CLOSED = 3;
          window.WebSocket = PatchedWebSocket;
        }

        // 3. Catch unhandled errors and rejections
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          var msg = reason && (reason.message || String(reason)) || '';
          if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('vite') || msg.includes('ws:')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function (event) {
          var msg = event.message || '';
          if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('vite') || msg.includes('ws:')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
